name: Notify IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      submission_mode:
        description: Submit only the latest commit's changed pages or the full canonical list
        required: true
        default: changed
        type: choice
        options:
          - changed
          - full

permissions:
  actions: read
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Test IndexNow selection and publication checks
        run: node --test .github/scripts/indexnow-submit.test.cjs

      - name: Submit changed canonical URLs after publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INDEXNOW_BASE_SHA: ${{ github.event.before }}
          INDEXNOW_HEAD_SHA: ${{ github.sha }}
          INDEXNOW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_mode || 'changed' }}
        run: node .github/scripts/indexnow-submit.cjs
