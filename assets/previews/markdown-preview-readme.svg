<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Md Preview GitHub README preview</title>
  <desc id="desc">A product preview showing Md Preview rendering a GitHub README Markdown file on iPhone.</desc>
  <rect width="900" height="1200" fill="#f8fafc"/>
  <rect x="76" y="92" width="748" height="1016" rx="44" fill="#ffffff" stroke="#d8e0ea" stroke-width="4"/>
  <text x="126" y="170" fill="#16181d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="850">GitHub README preview</text>
  <text x="126" y="214" fill="#5d6674" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24">Render README.md as readable Markdown</text>
  <rect x="126" y="284" width="648" height="728" rx="34" fill="#111418"/>
  <rect x="156" y="328" width="588" height="640" rx="24" fill="#ffffff"/>
  <rect x="190" y="372" width="136" height="36" rx="18" fill="#eef1ff"/>
  <text x="214" y="397" fill="#3041a6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="850">README.md</text>
  <text x="190" y="470" fill="#16181d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" font-weight="850">Project Docs</text>
  <rect x="190" y="524" width="504" height="24" rx="12" fill="#e8edf4"/>
  <rect x="190" y="568" width="442" height="24" rx="12" fill="#e8edf4"/>
  <rect x="190" y="646" width="504" height="132" rx="18" fill="#f1f5f9"/>
  <text x="222" y="696" fill="#16181d" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="22">npm install</text>
  <text x="222" y="740" fill="#16181d" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="22">npm run docs</text>
  <rect x="190" y="832" width="140" height="40" rx="20" fill="#eef1ff"/>
  <rect x="348" y="832" width="124" height="40" rx="20" fill="#eef1ff"/>
  <rect x="490" y="832" width="104" height="40" rx="20" fill="#eef1ff"/>
  <text x="224" y="859" fill="#3041a6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="850">Tables</text>
  <text x="382" y="859" fill="#3041a6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="850">Code</text>
  <text x="523" y="859" fill="#3041a6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="850">Links</text>
  <text x="126" y="1084" fill="#16181d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="850">For developers reading docs on iOS</text>
</svg>
