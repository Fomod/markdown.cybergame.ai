name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.create.outputs.page_url }}
    steps:
      - name: Create GitHub Pages deployment
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function githubFetch(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                "x-github-api-version": "2022-11-28",
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            let data = null;
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                data = text;
              }
            }
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} ${url}: ${text}`);
            }
            return data;
          }

          async function findArtifactId(repository, runId) {
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const data = await githubFetch(`https://api.github.com/repos/${repository}/actions/runs/${runId}/artifacts?name=github-pages`);
              const artifact = data.artifacts?.find((item) => item.name === "github-pages" && !item.expired);
              if (artifact?.id) return artifact.id;
              await sleep(5000);
            }
            throw new Error("Could not find uploaded github-pages artifact");
          }

          async function getOidcToken(repository) {
            const audience = `https://github.com/${repository}`;
            const idTokenUrl = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(audience)}`;
            const response = await fetch(idTokenUrl, {
              headers: {
                authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
              },
            });
            if (!response.ok) {
              throw new Error(`OIDC token request failed: ${response.status} ${await response.text()}`);
            }
            const data = await response.json();
            return data.value;
          }

          async function main() {
            const repository = process.env.GITHUB_REPOSITORY;
            const sha = process.env.GITHUB_SHA;
            const runId = process.env.GITHUB_RUN_ID;
            if (!repository || !sha || !runId) {
              throw new Error("Missing GITHUB_REPOSITORY, GITHUB_SHA, or GITHUB_RUN_ID");
            }

            const artifactId = await findArtifactId(repository, runId);
            const oidcToken = await getOidcToken(repository);
            const deployment = await githubFetch(`https://api.github.com/repos/${repository}/pages/deployments`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
              },
              body: JSON.stringify({
                artifact_id: artifactId,
                environment: "github-pages",
                pages_build_version: sha,
                oidc_token: oidcToken,
              }),
            });

            const pageUrl = deployment.page_url || "https://markdown.cybergame.ai/";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deployment.id}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `status_url=${deployment.status_url || ""}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `page_url=${pageUrl}\n`);
            console.log(`Created Pages deployment ${deployment.id}`);
            console.log(`Status URL: ${deployment.status_url}`);

            if (deployment.status_url) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                await sleep(10000);
                const status = await githubFetch(deployment.status_url);
                console.log(`Pages deployment status probe ${attempt}: ${status.status || JSON.stringify(status)}`);
                if (/cancel|error|fail/i.test(String(status.status || ""))) {
                  throw new Error(`Pages deployment entered ${status.status}`);
                }
                if (/deployed|success/i.test(String(status.status || ""))) return;
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
